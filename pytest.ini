# ═══════════════════════════════════════════════════════════════
# pytest.ini — Test Runner Configuration
# ═══════════════════════════════════════════════════════════════
# This file is the MAIN CONFIG for pytest (like testng.xml in Java)
# pytest reads this automatically when you run `pytest` in terminal
# ───────────────────────────────────────────────────────────────

[pytest]

# ── TEST DISCOVERY ──────────────────────────────────────────────
# Where pytest looks for test files (like <test-classes> in testng.xml)
testpaths = tests

# File naming pattern pytest recognizes as a test file
python_files = test_*.py

# Function naming pattern inside test files
python_classes = Test*
python_functions = test_*


# ── PLAYWRIGHT BROWSER SETTINGS ─────────────────────────────────
# Default browser to run tests on (can override via CLI: --browser firefox)
# Options: chromium | firefox | webkit
addopts =
    --browser chromium
    --headed
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
    --html=reports/report.html
    --self-contained-html
    --tb=short
    -v

# Explanation of each addopts flag:
# --browser chromium         → use Chromium (our primary browser)
# --headed                   → show browser window (use --headless for CI)
# --screenshot only-on-failure → auto-capture screenshot when test fails
# --video retain-on-failure  → save video recording only when test fails
# --tracing retain-on-failure → save network+DOM trace only when test fails
# --html=reports/report.html → generate HTML report at this path
# --self-contained-html      → embed CSS/JS inside HTML (easy to share)
# --tb=short                 → show short traceback (not full stack dump)
# -v                         → verbose output — show each test name & result


# ── TIMEOUTS ────────────────────────────────────────────────────
# Default timeout for each test function in milliseconds
# If test takes longer than 60s it is marked as FAILED
timeout = 60000


# ── CUSTOM MARKERS ──────────────────────────────────────────────
# Markers = labels you put on tests to run specific groups
# Like TestNG @Groups("smoke") or @Groups("regression")
# Usage: pytest -m smoke  → runs only smoke tests
#        pytest -m "not slow" → skips slow tests
markers =
    smoke: Critical path tests — run on every deployment
    regression: Full regression suite — run nightly
    auth: Authentication related tests
    compose: Email compose and send tests
    drafts: Draft save and persistence tests
    inbox: Inbox actions tests (star, read, trash)
    search: Search and filter tests
    async_flow: Timing-dependent async tests (undo-send, scheduled)
    attachments: File attachment tests
    two_account: Tests requiring two mailbox accounts
    negative: Negative / error validation tests
    slow: Tests that take longer than normal (scheduled send)


# ── LOGGING ─────────────────────────────────────────────────────
# Show logs in terminal during test execution
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
