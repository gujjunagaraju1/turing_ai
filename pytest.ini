# ═══════════════════════════════════════════════════════════════
# pytest.ini — Test Runner Configuration
# ═══════════════════════════════════════════════════════════════
# This file is the MAIN CONFIG for pytest (like testng.xml in Java)
# pytest reads this automatically when you run `pytest` in terminal
# ───────────────────────────────────────────────────────────────

[pytest]

# ── TEST DISCOVERY ──────────────────────────────────────────────
# Where pytest looks for test files (like <test-classes> in testng.xml)
testpaths = tests

# File naming pattern pytest recognizes as a test file
python_files = test_*.py

# Function naming pattern inside test files
python_classes = Test*
python_functions = test_*


# ── PLAYWRIGHT BROWSER SETTINGS ─────────────────────────────────
# Default browser to run tests on (can override via CLI: --browser firefox)
# Options: chromium | firefox | webkit
#
# NOTE: --screenshot / --video / --tracing flags are intentionally OMITTED.
# The custom `page` fixture in conftest.py already handles all three manually
# (via page.screenshot(), context.tracing.start/stop, record_video_dir).
# Enabling them here AND in the fixture causes pytest-playwright to
# double-manage the same context → TargetClosedError on test 2+.
addopts =
    --browser chromium
    --headed
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --clean-alluredir
    --tb=short
    -v

# Explanation of each addopts flag:
# --browser chromium         → use Chromium (our primary browser)
# --headed                   → show browser window (use --headless for CI)
# --html=reports/report.html → generate HTML report at this path
# --self-contained-html      → embed CSS/JS inside HTML (easy to share)
# --alluredir=reports/allure-results → generate Allure test results directory
# --clean-alluredir          → cleans previous allure-results before run
# --tb=short                 → show short traceback (not full stack dump)
# -v                         → verbose output — show each test name & result


# ── TIMEOUTS ────────────────────────────────────────────────────
# Note: Playwright navigation and element timeouts are managed directly via settings.py
# (DEFAULT_TIMEOUT and NAV_TIMEOUT).


# ── CUSTOM MARKERS ──────────────────────────────────────────────
# Markers = labels you put on tests to run specific suites/groups
# Usage:
#   pytest -m sanity       → runs core sanity suite (critical happy paths)
#   pytest -m regression   → runs full regression suite (all test cases)
#   pytest -m smoke        → runs fast smoke suite
#   pytest -m negative     → runs negative / error validation tests
markers =
    sanity: Sanity test suite — core critical workflows & health verification
    regression: Full regression test suite — comprehensive coverage of all scenarios
    smoke: Smoke test suite — rapid build verification
    auth: Authentication & session management tests
    compose: Email composition, dispatch & validation tests
    drafts: Draft auto-save & persistence tests
    starred: Starred messages & folder organization tests
    inbox: Inbox actions tests (star, read, trash)
    search: Search, filtering & clear query tests
    e2e: End-to-End multi-account email exchange & attachment flows
    attachments: File attachment handling tests
    two_account: Tests requiring two mailbox accounts
    negative: Negative / error validation tests
    slow: Tests that take longer than normal (scheduled send)
    async_flow: Timing-dependent async tests (undo-send, scheduled)


# ── LOGGING ─────────────────────────────────────────────────────
# Show logs in terminal during test execution
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
